    <g transform="translate(664 584)">
      <path d="M0 0C22 5 44 17 63 32C84 49 103 72 122 98" fill="none" stroke="#ff8a5b" stroke-width="10" stroke-linecap="round" stroke-dasharray="10 16" opacity="0.9"/>
      <path d="M28 8C43 12 56 18 69 28" fill="none" stroke="#ffd08a" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
