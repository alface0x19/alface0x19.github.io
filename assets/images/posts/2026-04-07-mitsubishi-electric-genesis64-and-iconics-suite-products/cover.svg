      <text x="30" y="33" fill="#f2f5f9" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2">Mitsubishi Electric</text>
      <text x="30" y="61" fill="#9eb4c8" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="1.2">GENESIS64 / ICONICS Suite</text>
