<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Editorial cover for Mitsubishi Electric GENESIS64 and ICONICS Suite products advisory</title>
  <desc id="desc">An industrial control cabinet styled like a restrained studio dashboard. A local cache drawer slides open while a key tagged SQL credentials spills toward a SQLite disk, signaling plaintext secrets exposed inside industrial software.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1320"/>
      <stop offset="55%" stop-color="#14253c"/>
      <stop offset="100%" stop-color="#091018"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#243348"/>
      <stop offset="100%" stop-color="#101a28"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#293b53"/>
      <stop offset="100%" stop-color="#172232"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f15a29"/>
      <stop offset="50%" stop-color="#ffbe3d"/>
      <stop offset="100%" stop-color="#ff6b57"/>
    </linearGradient>
    <radialGradient id="vinyl" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1d2a3d"/>
      <stop offset="45%" stop-color="#0c1118"/>
      <stop offset="100%" stop-color="#020406"/>
    </radialGradient>
    <pattern id="noise" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="4" r="1" fill="#ffffff" opacity="0.05"/>
      <circle cx="11" cy="9" r="1" fill="#ffffff" opacity="0.04"/>
      <circle cx="15" cy="3" r="1" fill="#ffffff" opacity="0.03"/>
      <circle cx="6" cy="15" r="1" fill="#ffffff" opacity="0.04"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#noise)"/>
  <circle cx="1260" cy="170" r="180" fill="#ff8a3d" opacity="0.1" filter="url(#soft)"/>
  <circle cx="280" cy="760" r="240" fill="#3bb7a1" opacity="0.08" filter="url(#soft)"/>

  <g opacity="0.2">
