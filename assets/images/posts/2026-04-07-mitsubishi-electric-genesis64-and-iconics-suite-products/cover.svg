      <circle cx="335" cy="335" r="11" fill="#182536"/>
      <text x="335" y="238" text-anchor="middle" fill="#9ab1c6" font-family="Arial, Helvetica, sans-serif" font-size="20" letter-spacing="5">SQL CREDS</text>
      <text x="335" y="304" text-anchor="middle" fill="#f0f3f8" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="700" letter-spacing="4">PLAINTEXT</text>
      <text x="335" y="340" text-anchor="middle" fill="#90a6bc" font-family="Arial, Helvetica, sans-serif" font-size="24" letter-spacing="3">local cache leak</text>
