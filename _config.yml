# =========================
# Site settings
# =========================
title: alface0x19
name: alface0x19
description: Blog técnico • Segurança • DevOps • Write-ups
url: https://alface0x19.github.io
baseurl: ""
lang: pt-PT

podcast:
  title: alface0x19 Podcast
  description: Resumo semanal das notícias mais relevantes em IA, cloud, segurança e ecossistema developer.
  subtitle: Leituras semanais com contexto técnico, opinião e links para as fontes originais.
  author: alface0x19
  email: podcast@alface0x19.github.io
  category: Technology
  explicit: "no"
  image: /assets/images/index/icon.png

# =========================
# Theme (Dark)
# =========================
remote_theme: mmistakes/minimal-mistakes
minimal_mistakes_skin: dark

# =========================
# Build settings
# =========================
markdown: kramdown
highlighter: rouge
permalink: /:categories/:title/

# =========================
# Plugins (GitHub Pages OK)
# =========================
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-include-cache
  - jekyll-paginate

# =========================
# Pagination
# =========================
paginate: 10  # Número de posts por página
paginate_path: /page:num/

# =========================
# Analytics
# =========================
analytics:
  provider: google-gtag
  google:
    tracking_id: "G-N085QH7W6F"  # Substitua pelo seu ID do Google Analytics
    anonymize_ip: false

# =========================
# Author
# =========================
author:
  name: alface0x19
  bio: "Tech enthusiast • Tech Blogger"
  links:
    - label: GitHub
      icon: fab fa-github
      url: https://github.com/alface0x19
    - label: YouTube
      icon: fab fa-youtube
      url: https://www.youtube.com/@alface0x19

# =========================
# Defaults
# =========================
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author_profile: false
      read_time: true
      comments: false
      share: false
      related: true

# =========================
# Navigation
# =========================
header_pages:
  - index.md
  - podcast.md
  - support.md

# =========================
# Excludes
# =========================
exclude:
  - README.md
  - skills-lock.json
  - scripts/
  - config/
  - news_queue/
  - podcast-episode-template.md
